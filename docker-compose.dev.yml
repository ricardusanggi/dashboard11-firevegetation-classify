#docker-compose.dev.yml
version: "3.9"

services:
  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "8011:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8011 --reload

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3011:3011"


